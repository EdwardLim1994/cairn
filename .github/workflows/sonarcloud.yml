name: SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    if: vars.SONAR_PROJECT_KEY != '' && vars.SONAR_ORGANIZATION != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run all tests with coverage
        env:
          CAIRN_RUN_INTEGRATION: "1"
          AUTH_ENABLED: "false"
          OTEL_COLLECTOR_URL: http://localhost:4318
          PROJECT_ID: cairn-integration-tests
          AUTH_USERNAME: integration-test
          AUTH_PASSWORD: integration-test
          AUTH_SESSION_SECRET: integration-test-session-secret-32chars
        run: bun run vp test run --coverage --no-file-parallelism

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
