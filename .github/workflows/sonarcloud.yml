name: SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    if: vars.SONAR_PROJECT_KEY != '' && vars.SONAR_ORGANIZATION != ''
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: cairn_test
          MYSQL_USER: cairn_test
          MYSQL_PASSWORD: cairn_test_only
          MYSQL_ROOT_PASSWORD: cairn_test_root_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ucairn_test -pcairn_test_only"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Migrate test database
        env:
          DATABASE_URL: mysql://cairn_test:cairn_test_only@127.0.0.1:3306/cairn_test
        run: bun run db:migrate

      - name: Run unit, component, and integration tests with coverage
        env:
          DATABASE_URL: mysql://cairn_test:cairn_test_only@127.0.0.1:3306/cairn_test
          CAIRN_TEST_DATABASE_URL: mysql://cairn_test:cairn_test_only@127.0.0.1:3306/cairn_test
          OTEL_COLLECTOR_URL: http://localhost:4318
          PROJECT_ID: cairn-integration-tests
          AUTH_USERNAME: integration-test
          AUTH_PASSWORD: integration-test
          AUTH_SESSION_SECRET: integration-test-session-secret-32chars
        run: |
          bun run vp test run --coverage --no-file-parallelism --exclude "**/*.integration.test.ts"
          bun run test:integration

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
