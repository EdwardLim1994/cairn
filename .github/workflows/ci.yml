name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile

      - name: Check formatting, lint, and types
        run: bun run vp check

      - name: Lint
        run: bun run vp lint

      - name: Unit and component tests
        run: bun run test:unit

      - name: Check formatting
        run: bun run vp fmt --check

  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: cairn_test
          MYSQL_USER: cairn_test
          MYSQL_PASSWORD: cairn_test_only
          MYSQL_ROOT_PASSWORD: cairn_test_root_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ucairn_test -pcairn_test_only"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile

      - name: Integration tests
        env:
          DATABASE_URL: mysql://cairn_test:cairn_test_only@127.0.0.1:3306/cairn_test
          CAIRN_TEST_DATABASE_URL: mysql://cairn_test:cairn_test_only@127.0.0.1:3306/cairn_test
        run: bun run test:integration
