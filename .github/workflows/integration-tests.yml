name: Integration tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile

      - name: Embedded database integration tests
        env:
          OTEL_COLLECTOR_URL: http://localhost:4318
          PROJECT_ID: cairn-integration-tests
          AUTH_USERNAME: integration-test
          AUTH_PASSWORD: integration-test
          AUTH_SESSION_SECRET: integration-test-session-secret-32chars
        run: bun run test:integration
