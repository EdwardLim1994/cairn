services:
  mysql-test:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cairn_test
      MYSQL_USER: cairn_test
      MYSQL_PASSWORD: cairn_test_only
      MYSQL_ROOT_PASSWORD: cairn_test_root_only
    # Host-run tests read CAIRN_TEST_DATABASE_URL from .env. Keep its port aligned here.
    ports:
      - "${CAIRN_TEST_MYSQL_PORT:-13309}:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ucairn_test", "-pcairn_test_only"]
      interval: 2s
      timeout: 2s
      retries: 30
networks:
  default:
    name: cairn-personal_test
