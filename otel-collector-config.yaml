receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlp_http/app:
    endpoint: http://app:3000
    encoding: json
    headers:
      Authorization: "Bearer ${env:OTEL_INGEST_TOKEN}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/app]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/app]
