services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "${MYSQL_PORT:-3309}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      ca-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      OTEL_COLLECTOR_URL: ${OTEL_COLLECTOR_URL:?Set OTEL_COLLECTOR_URL in .env}
      PROJECT_ID: ${PROJECT_ID:?Set PROJECT_ID in .env}
      PORT: ${PORT:-3004}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_USERNAME: ${AUTH_USERNAME:?Set AUTH_USERNAME in .env}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?Set AUTH_PASSWORD in .env}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?Set AUTH_SESSION_SECRET in .env}
      OUTBOUND_HOST_GATEWAY: host.docker.internal
      OUTBOUND_REQUEST_TIMEOUT_MS: ${OUTBOUND_REQUEST_TIMEOUT_MS:-10000}
      TELEMETRY_QUIET_MS: ${TELEMETRY_QUIET_MS:-5000}
      TELEMETRY_MAX_WAIT_MS: ${TELEMETRY_MAX_WAIT_MS:-15000}
      PROTO_STORAGE_DRIVER: ${PROTO_STORAGE_DRIVER:-fs}
      PROTO_STORAGE_FS_BASE: /app/data/protos
      PROTO_STORAGE_S3_ENDPOINT: ${PROTO_STORAGE_S3_ENDPOINT:-}
      PROTO_STORAGE_S3_REGION: ${PROTO_STORAGE_S3_REGION:-}
      PROTO_STORAGE_S3_BUCKET: ${PROTO_STORAGE_S3_BUCKET:-}
      PROTO_STORAGE_S3_ACCESS_KEY_ID: ${PROTO_STORAGE_S3_ACCESS_KEY_ID:-}
      PROTO_STORAGE_S3_SECRET_ACCESS_KEY: ${PROTO_STORAGE_S3_SECRET_ACCESS_KEY:-}
      GRPC_DEFAULT_SSL_ROOTS_FILE_PATH: ${CA_CERT_URL:+/etc/cairn/ca/custom-ca.pem}
    ports:
      - "${PORT:-3004}:${PORT:-3004}"
    volumes:
      - proto_data:/app/data/protos
      - ca_data:/etc/cairn/ca:ro

  ca-init:
    image: alpine:3.21
    restart: "no"
    environment:
      CA_CERT_URL: ${CA_CERT_URL:-}
      CA_CERT_SHA256: ${CA_CERT_SHA256:-}
    volumes:
      - ca_data:/certs
    entrypoint: ["sh", "-c"]
    command:
      - >-
        set -eu;
        if [ -z "$${CA_CERT_URL:-}" ]; then exit 0; fi;
        : "$${CA_CERT_SHA256:?CA_CERT_SHA256 is required when CA_CERT_URL is set}";
        wget -O /certs/custom-ca.pem.tmp "$${CA_CERT_URL}";
        echo "$${CA_CERT_SHA256}  /certs/custom-ca.pem.tmp" | sha256sum -c -;
        mv /certs/custom-ca.pem.tmp /certs/custom-ca.pem

  # adminer:
  #   image: adminer:latest
  #   ports:
  #     - "${ADMINER_PORT:-8888}:8080"

volumes:
  mysql_data:
  proto_data:
  ca_data:
